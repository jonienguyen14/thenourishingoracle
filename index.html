<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Prep Oracle" />
  <title>✦ Meal Prep Oracle ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --lavender: #C9E8FC;
      --wisteria: #CFABD7;
      --rose: #B1768A;
      --gold: #FEEC96;
      --blush: #FEE9E8;
      --sky: #a8d8f0;
      --deep: #7B5EA7;
      --soft-white: #faf8ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--soft-white);
      font-family: 'Josefin Sans', sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    /* ── Aura mesh background — dreamy soft blobs ── */
    .holo-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 110% 90% at 10% 5%,  rgba(201,232,252,0.65) 0%, transparent 50%),
        radial-gradient(ellipse 90%  80% at 88% 5%,  rgba(207,171,215,0.55) 0%, transparent 50%),
        radial-gradient(ellipse 80%  70% at 70% 55%, rgba(238,210,235,0.45) 0%, transparent 55%),
        radial-gradient(ellipse 70%  60% at 15% 80%, rgba(177,118,138,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 60%  50% at 92% 82%, rgba(254,236,150,0.2)  0%, transparent 50%),
        radial-gradient(ellipse 55%  45% at 50% 48%, rgba(220,200,250,0.3)  0%, transparent 60%),
        linear-gradient(160deg, #f2eeff 0%, #fdf9ff 35%, #edf5ff 65%, #fff8fc 100%);
      animation: auraPulse 14s ease-in-out infinite alternate;
    }
    @keyframes auraPulse {
      0%   { opacity: 1;    filter: hue-rotate(0deg)   saturate(1); }
      33%  { opacity: 0.95; filter: hue-rotate(7deg)   saturate(1.06); }
      66%  { opacity: 0.93; filter: hue-rotate(-5deg)  saturate(1.09); }
      100% { opacity: 1;    filter: hue-rotate(3deg)   saturate(1.02); }
    }

    .app-wrap { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 60px; }

    /* Grain overlay */
    .grain { position: fixed; inset: 0; z-index: 0; opacity: 0.025; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    @keyframes fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes sparkle  { 0%,100% { opacity:1; transform:scale(1) rotate(0deg); } 50% { opacity:0.3; transform:scale(0.6) rotate(180deg); } }
    @keyframes floatY   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shimmer  { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

    .fade-up { animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both; }
    .fade-in { animation: fadeIn 0.3s ease both; }

    /* Card base */
    .card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(207,171,215,0.3);
      border-radius: 18px;
      box-shadow: 0 2px 24px rgba(123,94,167,0.08), 0 1px 4px rgba(123,94,167,0.05);
    }
    .card-glow {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(207,171,215,0.4);
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(123,94,167,0.12), 0 0 0 0.5px rgba(207,171,215,0.3);
    }

    /* Phase button */
    .phase-btn {
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
      transition: all 0.25s cubic-bezier(.22,.68,0,1.2);
      cursor: pointer;
      border: 1.5px solid transparent;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .phase-btn:active { transform: scale(0.97); }

    /* Pill toggle */
    .pill {
      padding: 9px 14px;
      border-radius: 40px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      border: 1.5px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
      background: rgba(255,255,255,0.6);
    }

    /* Food chip (selector) */
    .chip {
      padding: 6px 13px;
      border-radius: 30px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1.5px solid rgba(207,171,215,0.5);
      background: rgba(255,255,255,0.6);
      color: #9b7faa;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: linear-gradient(135deg, var(--wisteria), var(--rose));
      color: white;
      border-color: transparent;
      box-shadow: 0 2px 12px rgba(177,118,138,0.35);
    }

    /* Ingredient chip — in cook steps */
    .ingr-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 24px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      background: rgba(255,255,255,0.8);
      border: 1.5px solid rgba(207,171,215,0.4);
      color: #5a3e6e;
      white-space: nowrap;
    }
    .ingr-chip .ingr-qty {
      font-size: 10px;
      color: #b09abc;
      font-weight: 400;
      padding-left: 2px;
      border-left: 1px solid rgba(207,171,215,0.5);
      margin-left: 2px;
    }

    /* Shop chip — ingredient list */
    .shop-chip {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 9px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.78);
      border: 1.5px solid rgba(207,171,215,0.35);
      backdrop-filter: blur(8px);
    }
    .shop-chip .shop-name {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #4a3360;
      letter-spacing: 0.3px;
    }
    .shop-chip .shop-qty {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 10px;
      color: #b09abc;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Cook step card */
    .cook-step {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(207,171,215,0.28);
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(123,94,167,0.07);
      padding: 20px 20px 18px;
      margin-bottom: 12px;
    }

    /* Step number bubble */
    .step-num {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: white;
      box-shadow: 0 3px 12px rgba(123,94,167,0.3);
    }

    /* Time badge */
    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 11px;
      border-radius: 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.9);
      border: 1.5px solid rgba(207,171,215,0.5);
      color: #7b5ea7;
      white-space: nowrap;
    }

    /* Appliance badge */
    .appl-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Step title */
    .step-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 600;
      color: #3e2d54;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    /* Cook instruction text — large for in-kitchen reading */
    .cook-instr {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 14px;
      color: #6a5080;
      line-height: 1.8;
      letter-spacing: 0.15px;
    }

    /* Input */
    .inp {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(207,171,215,0.4);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      color: #5a3e6e;
      letter-spacing: 0.3px;
      transition: border-color 0.2s;
    }
    .inp:focus { outline: none; border-color: var(--wisteria); box-shadow: 0 0 0 3px rgba(207,171,215,0.15); }
    .inp::placeholder { color: #c4aed0; }

    /* Generate button */
    .gen-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .gen-btn:not(:disabled) {
      background: linear-gradient(135deg, #c9a8d8 0%, #a8c8e8 50%, #d4a8c8 100%);
      background-size: 200% auto;
      color: white;
      box-shadow: 0 4px 24px rgba(169,136,200,0.4);
      animation: shimmer 3s linear infinite;
    }
    .gen-btn:not(:disabled):active { transform: scale(0.98); }
    .gen-btn:disabled { background: rgba(207,171,215,0.3); color: #c4aed0; cursor: not-allowed; }

    /* Tabs */
    .tab-btn {
      padding: 8px 14px;
      border-radius: 30px;
      white-space: nowrap;
      border: 1.5px solid rgba(207,171,215,0.4);
      background: rgba(255,255,255,0.6);
      color: #b09abc;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--wisteria) 0%, var(--sky) 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 2px 14px rgba(169,136,200,0.4);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    button { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { height: 3px; width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(207,171,215,0.5); border-radius: 3px; }

    .label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #c4aed0;
      font-weight: 600;
      margin: 0 0 8px;
    }

    /* Section divider */
    .divider {
      display: flex; align-items: center; gap: 10px; margin: 4px 0 16px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(207,171,215,0.4), transparent);
    }
  </style>
</head>
<body>
  <div class="holo-bg"></div>
  <div class="grain"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useEffect } = React;

    const PHASES = [
      { id:"menstrual",  label:"Menstrual",  emoji:"🌑", days:"Days 1–5",
        grad:"linear-gradient(135deg,#e8b4b8,#d4849a)", color:"#c06880", accent:"#e8b4b8",
        bg:"rgba(232,180,184,0.15)", desc:"Rest & restore · Iron-rich · Warm" },
      { id:"follicular", label:"Follicular", emoji:"🌱", days:"Days 6–13",
        grad:"linear-gradient(135deg,#b4d4e8,#84a8d4)", color:"#5a8ab8", accent:"#a8ccf0",
        bg:"rgba(180,212,232,0.15)", desc:"Rising energy · Fresh · Light" },
      { id:"ovulatory",  label:"Ovulatory",  emoji:"🌕", days:"Days 14–16",
        grad:"linear-gradient(135deg,#f0d890,#e8b86c)", color:"#c49030", accent:"#f0d890",
        bg:"rgba(240,216,144,0.15)", desc:"Peak power · Vibrant · Anti-inflammatory" },
      { id:"luteal",     label:"Luteal",     emoji:"🌘", days:"Days 17–28",
        grad:"linear-gradient(135deg,#c4a8d8,#9878b8)", color:"#7B5EA7", accent:"#c4a8d8",
        bg:"rgba(196,168,216,0.15)", desc:"Slow down · Comforting · Magnesium-rich" },
    ];

    const SEASONS = ["🌸 Spring","☀️ Summer","🍂 Fall","❄️ Winter"];
    const TABS = ["🍽","🛒","👩‍🍳","🔄","🧊","📅"];
    const TAB_LABELS = ["Meals","Shop","Cook","Remix","Safety","Schedule"];

    function getCurrentSeason() {
      const m = new Date().getMonth();
      if (m>=2&&m<=4) return "🌸 Spring";
      if (m>=5&&m<=7) return "☀️ Summer";
      if (m>=8&&m<=10) return "🍂 Fall";
      return "❄️ Winter";
    }

    const FOODS = [
      { label:"⭐ The Usual", value:"mango, broccoli, sweet potato, chicken, Greek yogurt, chia seeds, eggs" },
      { label:"🥭 Mango", value:"mango" },
      { label:"🥦 Broccoli", value:"broccoli" },
      { label:"🍠 Sweet Potato", value:"sweet potato" },
      { label:"🍗 Chicken", value:"chicken" },
      { label:"🥩 Ground Beef", value:"ground beef" },
      { label:"🐟 Salmon", value:"salmon" },
      { label:"🫙 Greek Yogurt", value:"Greek yogurt" },
      { label:"🌑 Chia Seeds", value:"chia seeds" },
      { label:"🥚 Eggs", value:"eggs" },
      { label:"🌱 Beyond Meat", value:"Beyond Meat" },
      { label:"🍋 Tofu", value:"tofu" },
      { label:"🌾 Quinoa", value:"quinoa" },
      { label:"🥑 Avocado", value:"avocado" },
      { label:"🍓 Berries", value:"berries" },
      { label:"🫘 Edamame", value:"edamame" },
      { label:"🥬 Spinach", value:"spinach" },
      { label:"🌿 Tempeh", value:"tempeh" },
      { label:"🌶 Kimchi", value:"kimchi" },
      { label:"🥜 Almond Butter", value:"almond butter" },
    ];

    // Phase-specific featured recipes (Jonie's own recipes, baked in)
    const PHASE_RECIPES = {
      menstrual: {
        name: "Instant Pot Potato & Mushroom Beef Chili",
        emoji: "🍲",
        tag: "iron-rich · warming · batch-friendly",
        hint: "Ground beef chili is your menstrual phase go-to — iron-rich and deeply comforting.",
        featured: "FEATURED DINNER (make exactly this): Instant Pot Potato & Mushroom Beef Chili. Ingredients: 2 lbs ground beef, 3 potatoes diced, 8 oz cremini mushrooms sliced, 1 yellow onion diced, 3 garlic cloves minced, 1 can diced tomatoes, 1 can black beans, 1 can kidney beans, 1.5 cups frozen corn, 1.3 cups beef broth, chili powder/cumin/smoked paprika. Instant Pot: Sauté beef 6 min → add onion/garlic/mushrooms 4 min → add all remaining → High Pressure 9 min → natural release 10 min. Serve with avocado or shredded cheese.",
      },
      early_luteal: {
        name: "Thai Red Curry with Chicken, Tofu & Shiitakes",
        emoji: "🍛",
        tag: "comforting · magnesium-rich · cozy",
        hint: "Thai red curry with chicken and tofu is your early luteal comfort anchor.",
        featured: "FEATURED DINNER (make exactly this): Instant Pot Thai Red Curry with Chicken, Tofu & Shiitakes. Ingredients: 2.8 lbs chicken thighs, 14 oz tofu, 8 oz shiitakes, 1 onion, 6 garlic, 1.5 tbsp ginger, 6 tbsp red curry paste, 2 cans full-fat coconut milk, 1.5 cups chicken broth, potatoes/carrots (pressure cook), green beans/bell peppers/zucchini (simmer in after). Instant Pot: brown tofu → sear shiitakes → sauté aromatics → bloom curry paste in coconut cream → deglaze → pressure cook chicken+potatoes+carrots 6 min → stir in remaining coconut milk + tender veggies → simmer 5 min → finish with lime. Serve over jasmine rice.",
      },
      late_luteal: {
        name: "Ground Beef & Red Lentil Stew",
        emoji: "🫕",
        tag: "magnesium-rich · grounding · slow-cooked",
        hint: "Lentil beef stew is your late luteal wind-down — add crunchy green beans at the end.",
        featured: "FEATURED DINNER (make exactly this): Instant Pot Ground Beef & Red Lentil Stew with crunchy green beans. Ingredients: 2 lbs ground beef, 1.3 cups split red lentils, 1 onion, 4 garlic, 3 carrots, 3 potatoes, 6 cups broth, smoked paprika/curry powder/cumin/bay leaves. PLUS a handful of green beans blanched or quickly sautéed and stirred in at the end for crunch. Instant Pot: brown beef → sauté onion/garlic → combine everything → High Pressure 20 min → natural release 10 min → remove bay leaves → stir in green beans for crunch at the end.",
      },
    };

    // Which recipe applies to which phase (luteal handled in component with lutealWeek state)
    const getPhaseRecipe = (phaseId) => {
      if (phaseId === "menstrual") return PHASE_RECIPES.menstrual;
      return null; // luteal handled inline
    };

    // Helper: is this late luteal? (we'll let user indicate via week context, but default luteal = early)
    const catLabel = { proteins:"💪 Proteins", produce:"🥦 Produce", pantry:"🫙 Pantry", dairy:"🥛 Dairy" };
    const catEmoji = { proteins:"💪", produce:"🥦", pantry:"🫙", dairy:"🥛" };

    const RECIPIENTS = "jonie.nguyen14@gmail.com,pianowithjoe@gmail.com";

    const StarDot = ({style}) => (
      <svg width="12" height="12" viewBox="0 0 12 12" style={style} fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 0L6.8 5.2L12 6L6.8 6.8L6 12L5.2 6.8L0 6L5.2 5.2Z" fill="currentColor"/>
      </svg>
    );

    const SunLineArt = ({size=40, color="rgba(207,171,215,0.6)"}) => (
      <svg width={size} height={size} viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="8" stroke={color} strokeWidth="1"/>
        <path d="M20 4v4M20 32v4M4 20h4M32 20h4M7.5 7.5l2.8 2.8M29.7 29.7l2.8 2.8M29.7 7.5l-2.8 2.8M7.5 29.7l2.8 2.8" stroke={color} strokeWidth="1" strokeLinecap="round"/>
        <circle cx="20" cy="20" r="12" stroke={color} strokeWidth="0.5" strokeDasharray="2 3"/>
        <path d="M20 10 Q22 14 20 16 Q18 14 20 10Z M20 30 Q22 26 20 24 Q18 26 20 30Z M10 20 Q14 22 16 20 Q14 18 10 20Z M30 20 Q26 22 24 20 Q26 18 30 20Z" fill={color} opacity="0.5"/>
      </svg>
    );

    const MoonLineArt = ({size=24, color="rgba(207,171,215,0.5)"}) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke={color} strokeWidth="1" strokeLinecap="round"/>
      </svg>
    );

    // Map appliance name → emoji icon
    const applianceIcon = (appl="") => {
      const a = appl.toLowerCase();
      if (a.includes("instant pot")||a.includes("pressure")) return "⚡";
      if (a.includes("air fryer")||a.includes("airfryer")) return "💨";
      if (a.includes("sous vide")) return "🌡";
      if (a.includes("rice cooker")||a.includes("rice")) return "🍚";
      if (a.includes("oven")||a.includes("bake")||a.includes("roast")) return "🔥";
      if (a.includes("stove")||a.includes("pan")||a.includes("skillet")||a.includes("stovetop")) return "🍳";
      if (a.includes("blender")||a.includes("blend")||a.includes("mix")) return "🌀";
      if (a.includes("microwave")) return "📡";
      if (a.includes("no cook")||a.includes("no-cook")||a.includes("assembly")) return "🥣";
      return "🍽";
    };

    function App() {
      const [phase, setPhase] = useState(PHASES[1]);
      const [week, setWeek] = useState("");
      const [favFoods, setFavFoods] = useState("");
      const [customFood, setCustomFood] = useState("");
      const [season, setSeason] = useState(getCurrentSeason());
      const [useSeason, setUseSeason] = useState(true);
      const [prepFor, setPrepFor] = useState("both");
      const [budgetMin, setBudgetMin] = useState("");
      const [budgetMax, setBudgetMax] = useState("");
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState(0);
      const [emailSent, setEmailSent] = useState(false);
      const [usePhaseRecipe, setUsePhaseRecipe] = useState(true);
      const [lutealWeek, setLutealWeek] = useState("early"); // "early" | "late"
      const ph = phase;
      const phaseRecipe = ph.id === "luteal"
        ? (lutealWeek === "late" ? PHASE_RECIPES.late_luteal : PHASE_RECIPES.early_luteal)
        : getPhaseRecipe(ph.id);

      const budgetLabel = () => {
        if (budgetMin && budgetMax) return `$${budgetMin}–$${budgetMax}/week`;
        if (budgetMin) return `$${budgetMin}+/week`;
        if (budgetMax) return `up to $${budgetMax}/week`;
        return "flexible";
      };

                    color:"#5a3e6e",letterSpacing:1,marginBottom:10}}>{result.theme}</h2>
                  <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,fontStyle:"italic",
                    color:"#8a6e9e",lineHeight:1.7,marginBottom:8}}>{result.phaseNote}</p>
                  <div style={{display:"inline-block",padding:"4px 14px",borderRadius:20,
                    background:ph.bg,border:`1px solid ${ph.accent}50`}}>
                    <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:10,color:ph.color,letterSpacing:0.5}}>💪 {result.proteinSummary}</p>
                  </div>
                </div>

                {/* Email button */}
                <div style={{marginBottom:14,textAlign:"center"}}>
                  <button onClick={()=>sendEmail(result)}
                    style={{padding:"10px 28px",borderRadius:40,border:`1.5px solid ${ph.accent}`,
                      background:emailSent?"rgba(255,255,255,0.6)":"rgba(255,255,255,0.85)",
                      color:ph.color,fontFamily:"'Josefin Sans',sans-serif",
                      fontSize:11,fontWeight:600,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",
                      boxShadow:emailSent?"none":`0 2px 16px ${ph.accent}40`,transition:"all 0.2s"}}>
                    {emailSent?"↻ resend?":"📧 send it?"}
                  </button>
                </div>

                {/* Tabs */}
                <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto",paddingBottom:4,WebkitOverflowScrolling:"touch"}}>
                  {TABS.map((tab,i)=>(
                    <button key={i} className={`tab-btn${activeTab===i?" active":""}`} onClick={()=>setActiveTab(i)}>
                      {tab} <span style={{marginLeft:4,textTransform:"uppercase",letterSpacing:1}}>{TAB_LABELS[i]}</span>
                    </button>
                  ))}
                </div>

                {/* ── Tab: Meals ── */}
                {activeTab===0&&(
                  <div className="fade-in">
                    {(result.meals||[]).map((m,i)=>(
                      <div key={i} className="card" style={{padding:"16px 18px",marginBottom:10}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                          <div style={{flex:1}}>
                            <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:9,letterSpacing:2.5,
                              color:ph.color,textTransform:"uppercase",marginBottom:4}}>{m.slot}</p>
                            <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:600,
                              color:"#5a3e6e",marginBottom:5}}>{m.name}</p>
                            <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:12,color:"#9b7faa",
                              lineHeight:1.6,letterSpacing:0.2}}>{m.description}</p>
                            <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:10,color:"#c4aed0",
                              marginTop:5,letterSpacing:0.5}}>✦ {m.highlight}</p>
                          </div>
                          <div style={{flexShrink:0,padding:"5px 12px",borderRadius:20,
                            background:ph.bg,border:`1px solid ${ph.accent}50`}}>
                            <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:12,
                              color:ph.color,fontWeight:600}}>{m.proteinPer}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                    {result.snacks&&(
                      <div style={{marginTop:20}}>
                        <p className="label" style={{marginBottom:10}}>🫙 Snacks</p>
                        {result.snacks.map((s,i)=>(
                          <div key={i} className="card" style={{padding:"10px 16px",display:"flex",
                            justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                            <div>
                              <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,
                                color:"#5a3e6e",fontWeight:600}}>{s.name}</span>
                              <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:11,
                                color:"#c4aed0",marginLeft:8}}>{s.note}</span>
                            </div>
                            <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:12,
                              color:ph.color,fontWeight:600}}>{s.protein}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* ── Tab: Shop ── */}
                {activeTab===1&&result.ingredientList&&(
                  <div className="fade-in">
                    {Object.entries(result.ingredientList).map(([cat,items])=>items&&items.length>0&&(
                      <div key={cat} style={{marginBottom:26}}>
                        {/* Category header */}
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                          <span style={{fontSize:15}}>{catEmoji[cat]||"📦"}</span>
                          <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:10,letterSpacing:2,
                            textTransform:"uppercase",color:"#9b7faa",fontWeight:600,margin:0}}>{catLabel[cat]||cat}</p>
                          <div style={{flex:1,height:1,
                            background:"linear-gradient(90deg,rgba(207,171,215,0.4),transparent)"}}/>
                          <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:9,
                            color:"#c4aed0",letterSpacing:1}}>{items.length} items</span>
                        </div>
                        {/* Chips */}
                        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                          {items.map((item,i)=>(
                            <div key={i} className="shop-chip">
                              <span className="shop-name">{item.item}</span>
                              <span className="shop-qty">{item.amount} {item.unit}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* ── Tab: Cook ── */}
                {activeTab===2&&result.cookInstructions&&(
                  <div className="fade-in">

                    {/* Session header */}
                    <div style={{
                      padding:"20px 22px",borderRadius:20,marginBottom:20,
                      background:`linear-gradient(135deg, rgba(255,255,255,0.92) 0%, ${ph.bg} 100%)`,
                      border:`1px solid ${ph.accent}50`,
                      boxShadow:`0 4px 24px ${ph.accent}20`
                    }}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                        <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:9,letterSpacing:3,
                          color:ph.color,textTransform:"uppercase",margin:0}}>Cook Session</p>
                        <div style={{
                          display:"inline-flex",alignItems:"center",gap:6,
                          padding:"7px 16px",borderRadius:24,
                          background:`linear-gradient(135deg,${ph.color},${ph.accent})`,
                          fontFamily:"'Josefin Sans',sans-serif",fontSize:13,
                          fontWeight:600,color:"white",letterSpacing:0.5,
                          boxShadow:`0 2px 12px ${ph.accent}50`
                        }}>
                          ⏱ {result.cookInstructions.totalTime}
                        </div>
                      </div>
                      <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,fontStyle:"italic",
                        color:"#5a3e6e",lineHeight:1.65,margin:0}}>{result.cookInstructions.overview}</p>
                    </div>

                    {/* Steps */}
                    {(result.cookInstructions.steps||[]).map((step,i)=>(
                      <div key={i} className="cook-step">

                        {/* Step header */}
                        <div style={{display:"flex",alignItems:"flex-start",gap:14,marginBottom:14}}>
                          {/* Step number */}
                          <div className="step-num"
                            style={{background:`linear-gradient(135deg,${ph.color},${ph.accent})`}}>
                            {step.step}
                          </div>

                          {/* Title + badges */}
                          <div style={{flex:1,minWidth:0}}>
                            <span className="step-title">{step.title}</span>
                            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:7}}>
                              {/* Time badge */}
                              <span className="time-badge">
                                ⏱ {step.duration}
                              </span>
                              {/* Appliance badge */}
                              <span className="appl-badge"
                                style={{background:ph.bg,color:ph.color,border:`1px solid ${ph.accent}50`}}>
                                {applianceIcon(step.appliance)} {step.appliance}
                              </span>
                            </div>
                          </div>
                        </div>

                        {/* Key ingredient chips */}
                        {step.keyIngredients&&step.keyIngredients.length>0&&(
                          <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:14}}>
                            {step.keyIngredients.map((ki,j)=>(
                              <span key={j} className="ingr-chip">
                                {ki.name}
                                {ki.qty&&<span className="ingr-qty">{ki.qty}</span>}
                              </span>
                            ))}
                          </div>
                        )}

                        {/* Thin divider */}
                        <div style={{height:1,
                          background:"linear-gradient(90deg,transparent,rgba(207,171,215,0.3),transparent)",
                          marginBottom:13}}/>

                        {/* Instructions — large readable text */}
                        <p className="cook-instr">{step.instructions}</p>
                      </div>
                    ))}

                    {/* Storage notes */}
                    {result.cookInstructions.storageNotes&&(
                      <div style={{padding:"16px 18px",borderRadius:16,marginTop:4,
                        background:`linear-gradient(135deg,${ph.bg},rgba(255,255,255,0.4))`,
                        border:`1px solid ${ph.accent}40`}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <span style={{fontSize:16}}>📦</span>
                          <p className="label" style={{margin:0}}>Storage Notes</p>
                        </div>
                        <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:13,
                          color:"#7a5e9a",lineHeight:1.7}}>{result.cookInstructions.storageNotes}</p>
                      </div>
                    )}
                  </div>
                )}

                {/* ── Tab: Remixes ── */}
                {activeTab===3&&result.remixes&&(
                  <div className="fade-in">
                    {result.remixes.map((remix,i)=>(
                      <div key={i} style={{marginBottom:22}}>
                        <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,fontStyle:"italic",
                          color:"#5a3e6e",marginBottom:10}}>🫙 from: <em>{remix.baseBatch}</em></p>
                        {(remix.variations||[]).map((v,j)=>(
                          <div key={j} className="card" style={{padding:"14px 16px",marginBottom:8}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                              <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,
                                fontWeight:600,color:"#5a3e6e"}}>{v.name}</span>
                              <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:9,
                                letterSpacing:1,color:ph.color,background:ph.bg,
                                padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap",
                                border:`1px solid ${ph.accent}40`,textTransform:"uppercase"}}>{v.vibe}</span>
                            </div>
                            <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:12,
                              color:"#9b7faa",lineHeight:1.6,marginTop:5,letterSpacing:0.2}}>{v.howTo}</p>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                )}

                {/* ── Tab: Safety ── */}
                {activeTab===4&&result.foodSafety&&(
                  <div className="fade-in">
                    <p className="label" style={{marginBottom:8}}>🌡 Refrigerate</p>
                    <div className="card" style={{overflow:"hidden",marginBottom:16}}>
                      {(result.foodSafety.fridge||[]).map((item,i)=>(
                        <div key={i} style={{padding:"11px 16px",display:"grid",gridTemplateColumns:"1fr auto",
                          gap:10,alignItems:"center",
                          borderBottom:i<result.foodSafety.fridge.length-1?"1px solid rgba(207,171,215,0.2)":"none"}}>
                          <div>
                            <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,
                              fontWeight:600,color:"#5a3e6e"}}>{item.item}</span>
                            <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:10,
                              color:"#c4aed0",marginLeft:8}}>{item.tip}</span>
                          </div>
                          <span style={{padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap",
                            background:"rgba(180,232,200,0.3)",border:"1px solid rgba(100,180,130,0.3)",
                            fontFamily:"'Josefin Sans',sans-serif",fontSize:11,
                            color:"#3a7a5a",fontWeight:600}}>{item.duration}</span>
                        </div>
                      ))}
                    </div>
                    <p className="label" style={{marginBottom:8}}>🧊 Freeze</p>
                    <div className="card" style={{overflow:"hidden",marginBottom:16}}>
                      {(result.foodSafety.freezer||[]).map((item,i)=>(
                        <div key={i} style={{padding:"11px 16px",display:"grid",gridTemplateColumns:"1fr auto",
                          gap:10,alignItems:"center",
                          borderBottom:i<result.foodSafety.freezer.length-1?"1px solid rgba(207,171,215,0.2)":"none"}}>
                          <div>
                            <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,
                              fontWeight:600,color:"#5a3e6e"}}>{item.item}</span>
                            <span style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:10,
                              color:"#c4aed0",marginLeft:8}}>{item.tip}</span>
                          </div>
                          <span style={{padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap",
                            background:"rgba(180,210,240,0.3)",border:"1px solid rgba(100,150,200,0.3)",
                            fontFamily:"'Josefin Sans',sans-serif",fontSize:11,
                            color:"#3a6090",fontWeight:600}}>{item.duration}</span>
                        </div>
                      ))}
                    </div>
                    {result.foodSafety.notes&&(
                      <div style={{padding:"12px 16px",borderRadius:14,
                        background:`linear-gradient(135deg,${ph.bg},rgba(255,255,255,0.4))`,
                        border:`1px solid ${ph.accent}40`}}>
                        <p className="label" style={{marginBottom:4}}>⚠️ Note</p>
                        <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:12,color:"#9b7faa",lineHeight:1.6}}>{result.foodSafety.notes}</p>
                      </div>
                    )}
                  </div>
                )}

                {/* ── Tab: Schedule ── */}
                {activeTab===5&&result.schedule&&(
                  <div className="fade-in">
                    <div style={{padding:"18px 20px",borderRadius:16,marginBottom:14,textAlign:"center",
                      background:`linear-gradient(135deg,${ph.color}dd,${ph.accent}bb)`,
                      boxShadow:`0 4px 24px ${ph.accent}50`}}>
                      <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:9,letterSpacing:3,
                        textTransform:"uppercase",color:"rgba(255,255,255,0.7)",marginBottom:4}}>main prep session</p>
                      <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:24,fontWeight:300,
                        color:"white",letterSpacing:2}}>{result.schedule.prepDay} · {result.schedule.prepTime}</p>
                    </div>
                    {(result.schedule.reminders||[]).map((r,i)=>(
                      <div key={i} className="card" style={{padding:"12px 16px",display:"flex",
                        gap:14,alignItems:"center",marginBottom:8}}>
                        <div style={{flexShrink:0,textAlign:"center",minWidth:54}}>
                          <div style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:8,letterSpacing:1.5,
                            color:ph.color,textTransform:"uppercase",fontWeight:600}}>{r.day}</div>
                          <div style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:12,
                            fontWeight:600,color:"#5a3e6e"}}>{r.time}</div>
                        </div>
                        <div style={{width:1,height:28,background:"rgba(207,171,215,0.3)"}}/>
                        <div style={{flex:1}}>
                          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,
                            fontWeight:600,color:"#5a3e6e"}}>{r.task}</div>
                          {r.note&&<div style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:10,
                            color:"#c4aed0",marginTop:2,letterSpacing:0.3}}>{r.note}</div>}
                        </div>
                        <StarDot style={{color:"rgba(207,171,215,0.6)",width:10,height:10,flexShrink:0}}/>
                      </div>
                    ))}
                    <div className="card-glow" style={{padding:"20px",textAlign:"center",marginTop:12}}>
                      <p style={{fontFamily:"'Josefin Sans',sans-serif",fontSize:9,letterSpacing:2.5,
                        color:ph.color,textTransform:"uppercase",marginBottom:6}}>📲 add to calendar</p>
                      <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",
                        color:"#9b7faa",marginBottom:14}}>Import reminders into Apple or Google Calendar</p>
                      <button onClick={downloadICS}
                        style={{padding:"12px 28px",borderRadius:40,border:"none",
                          background:`linear-gradient(135deg,${ph.color},${ph.accent})`,
                          color:"white",fontFamily:"'Josefin Sans',sans-serif",fontSize:11,
                          fontWeight:600,letterSpacing:2,textTransform:"uppercase",
                          boxShadow:`0 4px 20px ${ph.accent}50`,cursor:"pointer"}}>
                        ⬇ Download .ics
                      </button>
                    </div>
                  </div>
                )}

              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
